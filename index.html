jou:{m:7,t:'Transformasi Joukowski → profil sayap',p:[['e','Ketebalan (offset ε)',.02,.3,.01,.1],['dd','Lengkung (camber δ)',0,.3,.01,.08]],d:'Aplikasi aerospace: lingkaran (kiri) yang melewati z = 1 dipetakan oleh w = z + 1/z menjadi profil sayap (kanan). Geser pusat lingkaran ke kiri (ε) untuk menebalkan sayap, naikkan (δ) untuk melengkungkan. Titik z = 1 menjadi tepi belakang yang runcing.',
run:(g,W,H,p)=>{const[A,B]=side2(g,W,H,[-2.6,2.6,-1.8,1.8],[-2.6,2.6,-1.8,1.8]),R=Math.hypot(1+p.e,p.dd),C=Array.from({length:181},(_,i)=>{const t=i/180*6.2832;return[-p.e+R*Math.cos(t),p.dd+R*Math.sin(t)]}),J=C.map(([x,y])=>{const r=x*x+y*y;return[x+x/r,y-y/r]});A.axes(1,1);B.axes(1,1);A.pts(C,'#22d3ee',2.2);A.dot(1,0,'#f43f5e',4,'z=1');A.dot(-p.e,p.dd,'#fbbf24',3);B.fill(J,'rgba(99,102,241,.5)');B.pts(J,'#a5b4fc',2.6);B.dot(2,0,'#f43f5e',4,'tepi belakang');A.txt('bidang z',-2.5,1.6,'#94a3b8');B.txt('profil sayap',-2.5,1.6,'#94a3b8');A.frame();B.frame();
return`Kord ≈ 4 satuan. Tebal maksimum ≈ 1,3·ε·kord = <b>${(1.3*p.e*100).toFixed(0)}%</b> dari kord. Lengkung profil sebanding dengan δ = <b>${p.dd}</b>${p.dd<.005?' (δ = 0: profil simetris)':''}. Dengan teorema Kutta–Joukowski, sirkulasi di sekitar profil ini menghasilkan gaya angkat L′ = ρVΓ.`}},
nwt:{m:8,t:'Metode Newton–Raphson',p:[['x0','Tebakan awal x₀',-.5,3.5,.05,3],['k','Jumlah iterasi',0,8,1,3]],d:'Mencari akar f(x) = x³ − 2x − 5. Tiap iterasi: tarik garis singgung (oranye) di titik sekarang, titik potongnya dengan sumbu-x menjadi tebakan berikutnya. Konvergensi kuadratik: jumlah digit benar kira-kira berlipat dua tiap langkah. Coba x₀ dekat 0,8 (f′ ≈ 0): langkah melompat jauh.',
run:(g,W,H,p)=>{const h=one(g,W,H,[-1,4.5,-10,40]),f=x=>x*x*x-2*x-5,fp=x=>3*x*x-2;h.axes(1,10);h.path(f,'#22d3ee',2.6);let x=p.x0;const xs=[x];for(let i=0;i<p.k;i++){const d=fp(x);if(Math.abs(d)<1e-6)break;const xn=x-f(x)/d;h.line([x,0],[x,f(x)],'#64748b',1,[3,3]);h.line([x,f(x)],[xn,0],'#fb923c',2);h.dot(x,f(x),'#fb923c',3.5);x=xn;xs.push(x)}h.dot(x,0,'#fff',5,'x'+(xs.length-1));h.frame();let r=3;for(let i=0;i<50;i++)r-=f(r)/fp(r);

rng:{m:8,t:'Interpolasi polinom dan fenomena Runge',p:[['n','Jumlah titik n',3,24,1,10],['tp','Titik: 0 = seragam, 1 = Chebyshev',0,1,1,0]],d:'Fungsi f(x) = 1/(1+25x²) (cyan) dihampiri polinom interpolasi (oranye) yang melalui n titik. Dengan titik seragam, menambah n justru membuat osilasi di tepi makin besar (fenomena Runge). Titik Chebyshev, yang menumpuk di tepi, menyelesaikan masalah ini.',
run:(g,W,H,p)=>{const h=one(g,W,H,[-1.1,1.1,-.6,1.6]),f=x=>1/(1+25*x*x),n=p.n,xs=Array.from({length:n},(_,i)=>p.tp?Math.cos((2*i+1)*Math.PI/(2*n)):-1+2*i/(n-1)),ys=xs.map(f),L=x=>{let s=0;for(let i=0;i<n;i++){let t=ys[i];for(let j=0;j<n;j++)if(j!==i)t*=(x-xs[j])/(xs[i]-xs[j]);s+=t}return s};h.axes(.5,.5);h.path(f,'#22d3ee',2.4,300);h.path(L,'#fb923c',2.2,300);xs.forEach((x,i)=>h.dot(x,ys[i],'#fff',3.2));h.frame();let mx=0;for(let i=0;i<=400;i++){const x=-1+i/200;mx=Math.max(mx,Math.abs(L(x)-f(x)))}
return`n = <b>${n}</b> titik ${p.tp?'Chebyshev':'seragam'}: galat maksimum |L(x) − f(x)| = <b>${mx<100?mx.toFixed(3):mx.toExponential(1)}</b>. ${p.tp?'Galat turun saat n naik.':'Coba n = 6, lalu n = 16: galat di tepi justru membesar.'}`}},
clt:{m:9,t:'Teorema limit pusat',p:[['n','Jumlah variabel yang dirata-ratakan n',1,40,1,1],['tp','Sumber: 0 = seragam, 1 = eksponensial (miring)',0,1,1,1]],d:'Histogram 6.000 rata-rata dari n variabel acak, setelah dibakukan (dikurangi rata-rata, dibagi simpangan baku). Garis kuning = kurva normal baku. Walau sumbernya miring (eksponensial), histogram mendekati lonceng normal saat n membesar.',
run:(g,W,H,p,s)=>{const key=p.n+'|'+p.tp;if(s.key!==key){s.key=key;let q=12345;const R=()=>(q=(q*1664525+1013904223)%4294967296)/4294967296,B=Array(40).fill(0),mu=p.tp?1:.5,sd=p.tp?1:Math.sqrt(1/12);for(let i=0;i<6000;i++){let a=0;for(let j=0;j<p.n;j++)a+=p.tp?-Math.log(1-R()):R();const z=(a/p.n-mu)/(sd/Math.sqrt(p.n)),b=Math.floor((z+4)/8*40);if(b>=0&&b<40)B[b]++}s.B=B.map(v=>v/6000/.2)}

lp:{m:10,t:'Pemrograman linear (daerah layak)',p:[['th','Arah tujuan θ (°)',0,360,5,30],['lv','Garis tujuan: c·x = ',0,9,.1,4]],d:'Maksimalkan c·x dengan c = (cos θ, sin θ), syarat x ≤ 4, y ≤ 4, x + y ≤ 6, x, y ≥ 0 (daerah hijau). Garis kuning = garis tujuan; geser nilainya naik sampai hanya menyentuh satu titik sudut: itulah optimum. Optimum selalu ada di titik sudut. Pada θ = 45° garis sejajar sisi x + y = 6.',
run:(g,W,H,p)=>{const h=one(g,W,H,[-1,7,-1,7]),V=[[0,0],[4,0],[4,2],[2,4],[0,4]],r=p.th*Math.PI/180,c=[Math.cos(r),Math.sin(r)],P0=[p.lv*c[0],p.lv*c[1]],dr=[-c[1],c[0]];h.axes(1,1);h.fill(V,'rgba(34,197,94,.28)');h.pts([...V,V[0]],'#22c55e',2.4);h.line([P0[0]-14*dr[0],P0[1]-14*dr[1]],[P0[0]+14*dr[0],P0[1]+14*dr[1]],'#fbbf24',2.2);

VZ.eu={t:'Euler vs Runge–Kutta 4 pada y′ = −2y',min:.05,max:1,step:.05,v:.4,lab:'Langkah h',d:'Ungu: Euler. Hijau: RK4. Abu-abu: solusi eksak e^{−2x}. Perbesar h: Euler cepat meleset dan berosilasi, RK4 tetap dekat eksak.',fn:h=>[x=>Math.pow(1-2*h,Math.floor(x/h)),x=>Math.exp(-2*x),x=>{const z=-2*h;return Math.pow(1+z+z*z/2+z**3/6+z**4/24,Math.floor(x/h))}],xr:[0,4],yr:[-.5,1.5]};
VZ.pl={t:'Letak pole dan respons waktu',min:-1,max:.5,step:.05,v:-.3,lab:'Bagian real pole σ (pole = σ ± 3i)',d:'Respons e^{σt}cos 3t. σ<0 meluruh (stabil), σ=0 berosilasi konstan (batas stabil), σ>0 membesar (tidak stabil).',fn:a=>[t=>Math.exp(a*t)*Math.cos(3*t)],xr:[0,10],yr:[-3,3]};
VZ.al={t:'Aliasing dan teorema Nyquist (fs = 10 Hz)',min:1,max:19,step:.5,v:3,lab:'Frekuensi sinyal f (Hz)',d:'Ungu: sinyal asli. Abu-abu: sinyal yang tampak setelah disampel 10 Hz. Untuk f < 5 Hz keduanya sama; di atas 5 Hz muncul frekuensi palsu |f − 10k|.',fn:f=>{const fa=f-10*Math.round(f/10);return[x=>Math.sin(2*Math.PI*f*x),x=>Math.sin(2*Math.PI*fa*x)]},xr:[0,1],yr:[-1.5,1.5]};
let vk='fo';
function vz(){put(`<h2>Visualisasi Interaktif</h2><div class="c"><div class="row"><select onchange="vk=this.value;vz2()">${Object.entries(VZ).map(([k,v])=>`<option value="${k}" ${k==vk?'selected':''}>${v.t}</option>`).join('')}</select></div><div class="row"><span id="vl"></span><input type="range" id="vs" style="flex:1" oninput="draw()"></div><canvas id="cv" width="800" height="360"></canvas><p class="mu" id="vd"></p></div>`);vz2()}
function vz2(){const v=VZ[vk],s=$('#vs');s.min=v.min;s.max=v.max;s.step=v.step||1;s.value=v.v;$('#vd').textContent=v.d||'Ungu: aproksimasi. Abu-abu: fungsi asli.';draw()}
function draw(){const v=VZ[vk],val=+$('#vs').value;$('#vl').textContent=v.lab+' = '+val;const c=$('#cv'),g=c.getContext('2d'),W=c.width,H=c.height,cs=getComputedStyle(document.documentElement);
g.clearRect(0,0,W,H);const X=x=>(x-v.xr[0])/(v.xr[1]-v.xr[0])*W,Y=y=>H-(y-v.yr[0])/(v.yr[1]-v.yr[0])*H;
g.strokeStyle=cs.getPropertyValue('--bd');g.beginPath();g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.moveTo(X(0),0);g.lineTo(X(0),H);g.stroke();
v.fn(val).forEach((f,i)=>{g.strokeStyle=['#7c3aed','#94a3b8','#10b981'][i];g.lineWidth=i?2:2.5;g.beginPath();let st=0;for(let p=0;p<=W;p+=2){const x=v.xr[0]+p/W*(v.xr[1]-v.xr[0]),y=f(x);const py=Y(Math.max(v.yr[0]*3,Math.min(v.yr[1]*3,y)));st?g.lineTo(p,py):g.moveTo(p,py);st=1}g.stroke()})}
/* ===== QUIZ ===== */
let qz=null,qt=null;
function quiz(){if(!qz){put(`<h2>Latihan & Quiz</h2><div class="c"><div class="row"><select id="qm"><option value="">Semua modul</option>${[...new Set(Q.map(q=>q[0]))].map(i=>`<option value="${i}">${M[i].n}</option>`).join('')}</select><button class="b p" onclick="qs(false)">Mulai latihan</button><button class="b" onclick="qs(true)">Ujian simulasi (10 soal, 10 menit)</button></div><p class="mu">Bank soal saat ini ${Q.length} soal (Easy/Medium/Hard). Isian numerik diterima dengan toleransi 0,02.</p></div>`);return}
if(qz.i>=qz.l.length){clearInterval(qt);put(`<h2>Selesai</h2><div class="c"><div class="big">${qz.s} / ${qz.l.length}</div><p>Skor tersimpan dan masuk ke analitik.</p><button class="b p" onclick="go('qz')">Kembali</button></div>`);return}
const q=qz.l[qz.i];put(`<h2>Soal ${qz.i+1}/${qz.l.length} <span class="mu">${M[q[0]].n} · ${q[1]}</span>${qz.ex?`<span class="mu" id="tm" style="float:right"></span>`:''}</h2><div class="c"><p>${q[2]}</p>${q[3]?q[3].map((o,j)=>`<button class="b opt" onclick="qa(${j})">${o}</button>`).join(''):'<div class="row"><input id="na" type="number" step="any"><button class="b p" onclick="qa(+$(\'#na\').value)">Jawab</button></div>'}<div id="fb"></div></div>`);tick()}
function qs(ex){let l=Q.filter(q=>!$('#qm').value||q[0]==$('#qm').value).sort(()=>Math.random()-.5);if(ex)l=l.slice(0,10);if(!l.length)return;qz={l,i:0,s:0,ex,t:600,done:0};clearInterval(qt);if(ex)qt=setInterval(()=>{if(!qz||--qz.t<=0){clearInterval(qt);if(qz){qz.i=99;render()}}else tick()},1000);render()}
function tick(){const e=$('#tm');if(e&&qz)e.textContent=Math.floor(qz.t/60)+':'+String(qz.t%60).padStart(2,'0')}
function qa(a){if(qz.done)return;qz.done=1;const q=qz.l[qz.i],ok=q[3]?a==q[4]:Math.abs(a-q[4])<=.02;if(ok)qz.s++;(S.sc[q[0]]=S.sc[q[0]]||[]).push(ok?1:0);save();
document.querySelectorAll('.opt').forEach((b,j)=>{if(j==q[4])b.classList.add('ok');else if(j==a)b.classList.add('no')});
$('#fb').innerHTML=`<p><b>${ok?'Benar.':'Belum tepat.'}</b> ${q[5]}</p><button class="b p" onclick="qz.i++;qz.done=0;render()">${qz.i+1<qz.l.length?'Soal berikutnya':'Lihat skor'}</button>`}
/* ===== FLASHCARD ===== */
let fi=0,ff=0;
function fnx(){const w=F.map(f=>S.fcw[f.k]||1);let r=Math.random()*sum(w),j=0;while(j<w.length-1&&r>w[j]){r-=w[j];j++}return j}
function fk(m){const f=F[fi%F.length];S.fcw[f.k]=Math.min(8,Math.max(1,(S.fcw[f.k]||1)*m));save();fi=fnx();ff=0;render()}
function fc(){S.fcw=S.fcw||{};const f=F[fi%F.length],t=(X[f.i]&&X[f.i].r[f.n])||'';put(`<h2>Flashcard Rumus</h2><div class="c card" onclick="ff=!ff;render()" style="border-left:4px solid ${M[f.i].c}">${ff?'<div style="width:100%"><div class="fm" data-t="'+at(f.l)+'"></div><div class="rd" style="text-align:left;font:.9rem Public Sans">'+(t?'<b>Cara membaca:</b> '+t:'')+'</div></div>':f.n+'<br><span class="mu" style="font:.85rem Public Sans">'+M[f.i].n+'</span>'}</div><div class="row"><button class="b" onclick="fk(2)">Masih sulit</button><button class="b p" onclick="fk(.5)">Sudah hafal</button><button class="b" onclick="fi=fnx();ff=0;render()">Kartu acak</button><span class="mu">Klik kartu untuk membalik. Kartu sulit lebih sering muncul (bobot ${S.fcw[f.k]||1}).</span></div>`)}
/* ===== STUDY TOOLS ===== */
const T={left:1500,focus:1,run:0,h:null};
function pomo(){if(!T.run)return;if(T.focus&&T.left%60==0&&T.left<1500){S.min[td()]=(S.min[td()]||0)+1;save()}
if(--T.left<=0){T.focus=!T.focus;T.left=T.focus?1500:300}const e=$('#pt');if(e)e.textContent=String(Math.floor(T.left/60)).padStart(2,'0')+':'+String(T.left%60).padStart(2,'0')+(T.focus?' fokus':' istirahat')}
function st(){put(`<h2>Study Tools</h2><div class="c"><h3>Pomodoro 25/5</h3><div class="big" id="pt">${String(Math.floor(T.left/60)).padStart(2,'0')}:${String(T.left%60).padStart(2,'0')} ${T.focus?'fokus':'istirahat'}</div><p class="mu">Setiap menit fokus otomatis dicatat sebagai jam belajar. Timer tetap berjalan saat Anda pindah halaman.</p><div class="row"><button class="b p" onclick="T.run=!T.run;this.textContent=T.run?'Jeda':'Mulai'">${T.run?'Jeda':'Mulai'}</button><button class="b" onclick="T.run=0;T.focus=1;T.left=1500;render()">Reset</button></div></div>
<div class="c"><h3>Target belajar mingguan</h3><div class="row"><input type="number" min="1" value="${S.goal}" onchange="S.goal=Math.max(1,+this.value||10);save()"> jam per minggu</div></div>`)}
if(!T.h)T.h=setInterval(pomo,1000);
/* ===== PENGATURAN ===== */
function se(){put(`<h2>Pengaturan</h2><div class="c"><h3>Tema</h3><div class="row"><button class="b" onclick="S.theme='light';save();applyTheme();render()">Terang</button><button class="b" onclick="S.theme='dark';save();applyTheme();render()">Gelap</button><button class="b" onclick="S.theme='';save();applyTheme();render()">Ikuti sistem</button></div></div>
<div class="c"><h3>Export & import progres</h3><p class="mu">Salin teks JSON di bawah untuk backup. Tempel JSON lalu tekan Import untuk memulihkan.</p><textarea id="js">${JSON.stringify(S)}</textarea><div class="row"><button class="b p" onclick="try{S=Object.assign(S,JSON.parse($('#js').value));save();applyTheme();alert('Import berhasil');render()}catch(e){alert('JSON tidak valid. Periksa teks yang ditempel.')}">Import</button></div></div>
<div class="c"><h3>Reset data</h3><button class="b" onclick="if(confirm('Hapus semua progres?')){S={sub:{},min:{},sc:{},notes:{},bm:[],goal:10,theme:''};save();applyTheme();render()}">Hapus semua data</button></div>`)}
applyTheme();render();
</script></body></html>
